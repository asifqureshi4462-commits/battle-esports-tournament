name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK with Capacitor & Gradle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web assets
        run: npm run build

      - name: Install Capacitor Android dependencies
        run: |
          npm install --no-audit --no-fund @capacitor/core @capacitor/cli @capacitor/android
          if [ ! -d "android" ]; then
            npx cap add android
          else
            npx cap sync android
          fi

      - name: Align Kotlin standard library versions
        run: |
          cat > android/kotlin-version-fix.gradle <<'EOF'
          gradle.beforeProject { project ->
            project.configurations.configureEach {
              resolutionStrategy.eachDependency { details ->
                if (details.requested.group == "org.jetbrains.kotlin" &&
                    details.requested.name in [
                      "kotlin-stdlib",
                      "kotlin-stdlib-jdk7",
                      "kotlin-stdlib-jdk8"
                    ]) {
                  details.useVersion("1.8.22")
                  details.because("Align Kotlin stdlib versions to avoid duplicate classes")
                }
              }
            }
          }
          EOF

      - name: Build Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew -I kotlin-version-fix.gradle assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
